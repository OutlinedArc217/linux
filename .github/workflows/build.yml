name: Build MSM8916 Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}
      OUTPUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libncurses-dev build-essential python3 gcc-aarch64-linux-gnu wget

      - name: Prepare output directory
        run: mkdir -p $OUTPUT_DIR

      - name: Copy default config
        run: |
          cd $KERNEL_DIR
          make ARCH=arm64 O=$OUTPUT_DIR msm8916_defconfig

      - name: Enable required config options
        run: |
          cd $KERNEL_DIR
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_KGSL
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_KGSL_ADRENO
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_KGSL_DMA
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_KMS_HELPER
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM_GPU_STATE
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM_MDSS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM_MDP4
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM_MDP5
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM_DPU
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM_DP
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_MSM_DSI
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_PANEL
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --file $OUTPUT_DIR/.config --set-val CONFIG_DRM_FBDEV_OVERALLOC 100
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_LEGACY
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_LOAD_EDID_FIRMWARE
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_DRM_FB
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_FB
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_FB_CFB_FILLRECT
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_FB_CFB_COPYAREA
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_FB_CFB_IMAGEBLIT

          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_KVM
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_KVM_ARM_HOST
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_VHOST_NET
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_NAMESPACES
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_CGROUPS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_CGROUP_CPUACCT
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_MEMCG
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_USER_NS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_EXT4_FS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_BTRFS_FS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_XFS_FS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_F2FS_FS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_FUSE_FS
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_NETFILTER
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_BRIDGE
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_VLAN_8021Q
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_TCP_CONG_BBR
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_NET_SCH_FQ
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_PM
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_CPU_IDLE
          scripts/config --file $OUTPUT_DIR/.config --enable CONFIG_CPUFREQ

          make O=$OUTPUT_DIR olddefconfig

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          make -j$(nproc) O=$OUTPUT_DIR ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs modules

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image
